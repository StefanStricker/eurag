[project]
name = "eurag"
version = "0.1.0"
description = "RAG question answering over EU data law acts with citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "qdrant-client>=1.19,<1.20",  # match server qdrant/qdrant:v1.19.x (docker-compose.yml)
    "pymupdf>=1.24",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "fastembed-gpu>=0.9,<0.10",  # BM25 (CPU) and the reranker (GPU); same API as fastembed
    "onnxruntime-gpu[cuda,cudnn]>=1.31,<1.32",  # CUDA 13 + cuDNN as wheels, no CUDA base image
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eurag*"]

[tool.setuptools.package-data]
eurag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# pymupdf requires the CPU onnxruntime (only for pymupdf.layout, unused); it would overwrite the `onnxruntime`
# module of onnxruntime-gpu, which provides the same API
override-dependencies = ["onnxruntime; sys_platform == 'never'"]
