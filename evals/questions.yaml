# Evaluation questions for EU-RAG.
#
# expected:       units a correct answer should cite. `act` matches data/acts.yaml,
#                 `unit` is article / annex, `paragraph` is informational (not scored yet).
#                 `optional: true` = citing it is correct, but it doesn't count towards recall
#                 (used for "Art. 14 ff." style ranges, where only the core articles are required).
# expect_decline: true -> the system should refuse or say the sources don't cover it.

