# --- Cross-document / multi-hop ---------------------------------------------
- id: xdoc-01
  category: cross-document
  question: How does the ePrivacy Directive relate to the GDPR when both apply?
  expected:
    - {act: ePrivacy Directive, unit: article, number: "1", paragraph: "2"}
    - {act: GDPR, unit: article, number: "95"}
- id: xdoc-02
  category: cross-document
  question: What takes precedence if the Data Act conflicts with the GDPR?
  expected:
    - {act: Data Act, unit: article, number: "1", paragraph: "5"}
- id: xdoc-03
  category: cross-document
  question: How does the GDPR right to data portability differ from the Data Act’s data access right?
